image: gitpod/workspace-full

ports:
  # Server
  - port: 8080
    onOpen: open-browser

tasks:
    - init: curl -fsSL https://bun.sh/install | bash -s bun-v1.4.4 && ~/.bun/bin/bun install
      command: ~/.bun/bin/bun run serve

github:
    prebuilds:
        branches: true
        pullRequests: true
        addCheck: false

vscode:
    extensions:
        - dbaeumer.vscode-eslint
        - esbenp.prettier-vscode