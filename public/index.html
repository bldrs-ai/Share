    <!-- gtag stub only: buffers events into dataLayer everywhere (gtagEvent
         calls + E2E assertions rely on it). It never sends anything; the
         external gtag/js loader is injected by src/index/ga.js, and only on
         prod hosts, outside automation, for a visitor who has consented
         (design/new/analytics-consent.md). The config ID below must match
         ga.js#GA_MEASUREMENT_ID. -->
    <script type="application/javascript">
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Consent Mode v2: everything denied until the visitor says otherwise.
      // Must precede any config. Same object as ga.js#CONSENT_DEFAULT, and
      // the update below is ga.js#CONSENT_GRANTED (consent.test.js runs this
      // script and compares them).
      gtag('consent', 'default', {
        analytics_storage: 'denied', ad_storage: 'denied',
        ad_user_data: 'denied', ad_personalization: 'denied'
      });
      // The consent rule (privacy/consent.js: cookie `consentLevel`, value
      // `<version>.<level>`, version >= CONSENT_VERSION, level functional or
      // public) is duplicated here on purpose, because config has to be
      // decided before the bundle loads. No cookie, an old version or any
      // other level means not consented.
      function consentAllowsAnalytics() {
        var m = document.cookie.match(/(?:^|;\s*)consentLevel=(\d+)\.([a-z]+)/);
        return !!m && parseInt(m[1], 10) >= 1 && (m[2] === 'functional' || m[2] === 'public');
      }
      // Carried IN the config call rather than a `set` queued before it.
      // config is what triggers page_view / session_start / first_visit — the
      // events that make landing page and new-vs-returning queryable per user
      // — and gtag only guarantees a user property reaches them when it is
      // passed as config's own `user_properties` field. A preceding `set`
      // relies on queue-drain ordering that gtag does not document.
      //
      // The bundle cannot do this: it loads long after config is queued.
      // So the `cid.` prefix (analytics#OPEN_CID_PREFIX — a bare id is
      // numeric-looking, and GA4 won't populate a text dimension from a
      // number) is duplicated here on purpose, the same arrangement the
      // config ID already has with ga.js#GA_MEASUREMENT_ID.
      function userPropsBeforeConfig() {
        // _ga is `GA<version>.<domain depth>.<id>`, and the id itself has a dot
        var m = document.cookie.match(/(?:^|;\s*)_ga=GA\d+\.\d+\.([^;]+)/);
        return m ? {user_properties: {open_cid: 'cid.' + m[1]}} : {};
      }
      // config is queued only for a visitor who has already consented. One
      // who hasn't gets it from ga.js#updateGaConsent if they allow analytics
      // later, queued AFTER the consent update, so page_view goes out granted.
      //
      // Host and automation are deliberately NOT re-checked. Everything the
      // stub queues is inert off-prod because ga.js#shouldInitGa never
      // injects gtag/js there (asserted in ga.test.js), and the E2E suite
      // reads this buffer on localhost — the same reason isRealModelOpen
      // documents localhost as a deliberate exception.
      if (consentAllowsAnalytics()) {
        // Analytics only: every ad signal stays denied, and the config turns
        // off Google signals and ad-personalization signals (ga.js
        // #CONSENT_GRANTED, #GA_CONFIG). Google Ads is switched off.
        gtag('consent', 'update', {
          analytics_storage: 'granted', ad_storage: 'denied',
          ad_user_data: 'denied', ad_personalization: 'denied'
        });
        var config = userPropsBeforeConfig();
        config.allow_google_signals = false;
        config.allow_ad_personalization_signals = false;
        gtag('config', 'G-GRLNVMZRGW', config);
      }
    </script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="application/javascript">
      const loader = document.createElement('script')
      const pathPrefix = window.location.pathname.startsWith('/Share') ? '/Share' : ''
      loader.setAttribute('type', 'module')
      loader.setAttribute('src', pathPrefix + '/index.js')
      document.body.appendChild(loader)
    </script>
